    const CAUSAL_PATTERNS = [
      {
        code: 'Pattern A',
        name: 'Domino Chain Reaction',
        formula: '[Action / V-ing] + leads to / results in + [Noun], which eventually causes + [Person] + to [Verb].',
        zh: '某行為「導致」某結果，進而「令」某人做某事（三步連鎖反應）。',
        example:

      },
      {
        code: 'Pattern B',
        name: 'Enabling Positive Outcomes',
        formula: '[Action / V-ing] + enables / allows + [Person] + to [Verb]. As a result, [Outcome].',
        zh: '某行為「使」某人能夠做某事。「結果」，帶來正面影響。',
        example:
          'Working as a waiter <strong class="text-indigo-700">enables</strong> teenagers <strong class="text-indigo-700">to</strong> interact with different people. <strong class="text-indigo-700">As a result,</strong> they develop stronger communication skills.',
      },
      {
        code: 'Pattern C',
        name: 'Conditional Warning ("If... Consequently")',
        formula: 'If + [Subject + Present Tense], [Subject] + will fail to [Verb]. Consequently, [Negative Result].',

        name: 'Explaining Reasons ("This is mainly because...")',
        formula: '[Main Point]. This is mainly because + [Reason Clause]. Therefore, [Conclusion].',
        zh: '提出論點。「這主要是因為」……。「因此」，得出結論。',
        example:

    ];

    function initApp() {
      state.orderUserLists = ORDER_THEMES.map((theme) => shuffleArray(theme.sentences));
      renderTabs();
      renderCurrentStep();
      updateProgressUI();
    }

    function getRandomEncouragement(seed = 0) {
      return ENCOURAGEMENTS[seed % ENCOURAGEMENTS.length];
    }

    function awardStar(key, seed = 0) {
      const cheer = getRandomEncouragement(seed);
      const isNew = !state.awardedKeys.has(key);
      if (isNew) {
        state.awardedKeys.add(key);
        state.starsEarned += 1;
        const starEl = document.getElementById('star-count-text');
        if (starEl) {
          starEl.textContent = `${state.starsEarned} ${state.starsEarned === 1 ? 'Star' : 'Stars'}`;
        }
      }
      const prefix = isNew ? '+1 ⭐ ' : '';
      const msg = state.showChinese ? `${prefix}${cheer.en} (${cheer.zh})` : `${prefix}${cheer.en}`;
      showToast(msg, 'success');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass =
        type === 'success'
          ? 'bg-emerald-600 text-white'
          : type === 'warning'
          ? 'bg-amber-600 text-white'
          : 'bg-slate-800 text-white';
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center justify-between gap-3 fade-in ${bgClass}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function toggleChineseSupport() {
      state.showChinese = !state.showChinese;
      const badge = document.getElementById('zh-status-badge');
      badge.textContent = state.showChinese ? 'ON' : 'OFF';
      badge.className = state.showChinese
        ? 'px-1.5 py-0.5 rounded-md bg-indigo-600 text-white text-xs'
        : 'px-1.5 py-0.5 rounded-md bg-slate-400 text-white text-xs';
      renderCurrentStep();
    }

    function changeStep(delta) {
      const next = state.currentStep + delta;
      if (next >= 0 && next < STEPS.length) {
        goToStep(next);
      }
    }

    function goToStep(stepIndex) {
      state.currentStep = stepIndex;
      state.completedSteps.add(stepIndex);
      renderTabs();
      renderCurrentStep();
      updateProgressUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateProgressUI() {
      const count = state.completedSteps.size;
      const pct = Math.round((count / STEPS.length) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').textContent = `${count}/${STEPS.length}`;

      document.getElementById('prev-step-btn').disabled = state.currentStep === 0;
      const nextBtn = document.getElementById('next-step-btn');
      if (state.currentStep === STEPS.length - 1) {
        nextBtn.textContent = 'Completed ✓';
        nextBtn.disabled = true;
      } else {
        nextBtn.textContent = 'Next Step →';
        nextBtn.disabled = false;
      }
    }

    function renderTabs() {
      const tabContainer = document.getElementById('step-tabs');
      tabContainer.innerHTML = STEPS.map((step) => {
        const isActive = step.id === state.currentStep;
        const isVisited = state.completedSteps.has(step.id);
        return `
          <button
            onclick="goToStep(${step.id})"
            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 border ${
              isActive
                ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                : isVisited
                ? 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                : 'bg-slate-50 text-slate-500 border-transparent hover:bg-slate-100'
            }"
          >
            <span>${step.short}</span>
            ${isVisited && !isActive ? '<span class="text-emerald-500 font-bold">✓</span>' : ''}
          </button>
        `;
      }).join('');
    }

    function renderCurrentStep() {
      const container = document.getElementById('app-content');
      container.classList.remove('fade-in');
      void container.offsetWidth;
      container.classList.add('fade-in');

      switch (state.currentStep) {
        case 0:
          container.innerHTML = renderStep0();
          break;
        case 1:
          container.innerHTML = renderStep1();
          break;
        case 2:
          container.innerHTML = renderStep2();
          break;
        case 3:
          container.innerHTML = renderStep3();
          break;
        case 4:
          container.innerHTML = renderStep4();
          break;
        case 5:
          container.innerHTML = renderStep5();
          updateWordCount(false);
          break;
      }
    }

    function highlightKeyPhrase(fullText, keyIdea) {
      if (!keyIdea || !fullText.includes(keyIdea)) return fullText;
      return fullText.replace(
        keyIdea,
        `<mark class="bg-amber-200/90 text-slate-950 font-semibold px-1.5 py-0.5 rounded-md border-b-2 border-amber-500">${keyIdea}</mark>`
      );
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      if (copy.every((item, idx) => item.id === arr[idx].id)) {
        [copy[0], copy[1]] = [copy[1], copy[0]];
      }
      return copy;
    }

    function selectOrderTopic(topicIdx) {
      state.activeOrderTopic = topicIdx;
      renderCurrentStep();
    }

    function moveSentence(topicIdx, sentIdx, direction) {
      const list = state.orderUserLists[topicIdx];
      const targetIdx = sentIdx + direction;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      [list[sentIdx], list[targetIdx]] = [list[targetIdx], list[sentIdx]];

      const correctList = ORDER_THEMES[topicIdx].sentences;
      const allRight = list.every((item, i) => item.id === correctList[i].id);
      if (allRight) {
        state.orderChecked[topicIdx] = true;
        state.orderSolved[topicIdx] = true;
        awardStar(`order_${topicIdx}`, topicIdx + 1);
      }
      renderCurrentStep();
    }

    function reshuffleOrderTopic(topicIdx) {
      state.orderSolved[topicIdx] = false;
      state.orderChecked[topicIdx] = false;
      state.orderUserLists[topicIdx] = shuffleArray(ORDER_THEMES[topicIdx].sentences);
      renderCurrentStep();
    }

    function checkSentenceOrder(topicIdx) {
      state.orderChecked[topicIdx] = true;
      const userList = state.orderUserLists[topicIdx];
      const correctList = ORDER_THEMES[topicIdx].sentences;
      let correctPositions = 0;

      userList.forEach((item, idx) => {
        if (item.id === correctList[idx].id) correctPositions++;
      });

      if (correctPositions === correctList.length) {
        state.orderSolved[topicIdx] = true;
        awardStar(`order_${topicIdx}`, topicIdx + 1);
        renderCurrentStep();
      } else {
        showToast(
          `Good effort! ${correctPositions} of ${correctList.length} sentences are already in the right spot. Adjust the red ones!`,
          'warning'
        );
        renderCurrentStep();
      }
    }

          <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm">
            <span class="px-3 py-1 rounded-full bg-teal-50 text-teal-700 text-xs font-bold uppercase">
              Task 2B • Elaboration Technique 2
            </span>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-2">
              Sentence Patterns for Making Comparisons (對比比較句型)
            </h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">
              Comparing <strong>working vs. non-working students</strong> or <strong>school vs. workplace</strong> is the easiest way to add 25–30 words of strong elaboration.
            </p>
          </div>

          <!-- 4 Comparison Patterns -->
          <div class="grid md:grid-cols-2 gap-4">
            ${COMPARISON_PATTERNS.map(
              (p) => `
              <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between space-y-3">
                <div>
                  <div class="flex items-center justify-between">
                    <span class="px-2.5 py-0.5 rounded-md bg-teal-100 text-teal-800 text-xs font-extrabold">${p.code}</span>
                    <span class="text-xs font-bold text-slate-500">${p.name}</span>
                  </div>
                  <div class="mt-3 p-3 rounded-xl bg-slate-900 text-teal-200 font-mono text-xs leading-relaxed">
                    ${p.formula}
                  </div>
                  ${state.showChinese ? `<p class="text-xs text-slate-600 mt-2">${p.zh}</p>` : ''}
                </div>
                <div class="pt-3 border-t border-slate-100 text-xs sm:text-sm text-slate-800 leading-relaxed">
                  <span class="text-xs font-bold text-slate-400 uppercase block mb-0.5">Model Sentence:</span>
                  ${p.example}
                </div>
              </div>
            `
            ).join('')}
          </div>

          <!-- Mini Practice Quiz -->
          <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-4">
            <h3 class="text-lg font-extrabold text-slate-900">
              Quick Practice: Master Comparison Structures (即時練習)
            </h3>
            ${COMPARISON_QUIZ.map((q, qIdx) => {
              const selected = state.comparisonAnswers[qIdx];
              const isAnswered = selected !== null;
              const isCorrect = selected === q.correctIndex;
              return `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                  <p class="text-sm font-semibold text-slate-900">${q.question}</p>
                  <div class="flex flex-wrap gap-2">
                    ${q.options
                      .map((opt, oIdx) => {
                        let btnClass = 'bg-white border-slate-300 text-slate-700 hover:border-teal-500';
                        if (isAnswered) {
                          if (oIdx === q.correctIndex) {
                            btnClass = 'bg-emerald-600 border-emerald-600 text-white font-bold';
                          } else if (oIdx === selected) {
                            btnClass = 'bg-rose-600 border-rose-600 text-white';
                          } else {
                            btnClass = 'bg-white border-slate-200 text-slate-500 hover:border-teal-400';
                          }
                        }
                        return `
                          <button
                            onclick="answerComparisonQuiz(${qIdx}, ${oIdx})"
                            class="px-4 py-2 rounded-xl border text-xs sm:text-sm font-medium transition ${btnClass}"
                          >
                            ${opt}
                          </button>
                        `;
                      })
                      .join('')}
                  </div>
                  ${
                    isAnswered
                      ? isCorrect
                        ? `<div class="p-3.5 rounded-xl bg-emerald-100/80 border border-emerald-300 text-xs sm:text-sm text-emerald-950 space-y-1 fade-in">
                            <div class="font-extrabold text-emerald-800">
                              ${getRandomEncouragement(qIdx + 2).en} ${state.showChinese ? `(${getRandomEncouragement(qIdx + 2).zh})` : ''}
                            </div>
                            <div><strong>Why it works:</strong> ${q.explanation}</div>
                          </div>`
                        : `<div class="p-3.5 rounded-xl bg-rose-100/80 border border-rose-300 text-xs sm:text-sm text-rose-950 space-y-1 fade-in">
                            <div class="font-extrabold text-rose-800">
                              ✗ Almost! Check the structure tip below and try again! ${state.showChinese ? '(差一點！看看提示再試一次！)' : ''}
                            </div>
                            <div><strong>Tip:</strong> ${q.explanation}</div>
                          </div>`
                      : ''
                  }
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function answerComparisonQuiz(qIdx, optIdx) {
      state.comparisonAnswers[qIdx] = optIdx;
      if (optIdx === COMPARISON_QUIZ[qIdx].correctIndex) {
        awardStar(`comp_${qIdx}`, qIdx + 2);
      }
      renderCurrentStep();
    }

    // =========================================================================
    // 12. STEP 5: BEFORE & AFTER DEMONSTRATION + HOMEWORK DRAFTING PAD
    // =========================================================================
    function renderStep5() {
      const stageIdx = state.beforeAfterStage;
      const stage = BEFORE_AFTER_STAGES[stageIdx];

      return `
        <div class="space-y-6">
          <!-- Before & After Interactive Demonstration -->
          <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm">
            <span class="px-3 py-1 rounded-full bg-amber-50 text-amber-800 text-xs font-bold uppercase">
              Before & After • Elaboration Demonstration
            </span>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-2">
              Watch a Weak 17-Word Idea Grow into a 101-Word DSE Paragraph!
            </h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">
              Click Stages 1 to 4 below to see how adding a <strong>Comparison</strong>, a <strong>Causal Chain</strong>, and a <strong>Hong Kong Example</strong> transforms a weak draft:
            </p>

            <!-- Stage Selector Buttons -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-4">
              ${BEFORE_AFTER_STAGES.map(
                (st, i) => `
                <button
                  onclick="setBeforeAfterStage(${i})"
                  class="p-3 rounded-xl border text-left transition ${
                    i === stageIdx
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                  }"
                >
                  <div class="text-xs font-extrabold">${st.level.split(':')[0]}</div>
                  <div class="text-[11px] opacity-90 mt-0.5">${st.level.split(':')[1]}</div>
                </button>
              `
              ).join('')}
            </div>

            <!-- Active Stage Display -->
            <div class="mt-5 p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="font-extrabold text-slate-900 text-base">${stage.level}</h3>
                <span class="px-3 py-1 rounded-full text-xs font-bold border ${stage.badgeClass}">
                  ${stage.badge}
                </span>
              </div>

              <p class="text-sm sm:text-base text-slate-800 leading-loose bg-white p-4 rounded-xl border border-slate-200">
                ${stage.html}
              </p>

              <div class="text-xs sm:text-sm text-slate-700 bg-indigo-50/70 p-3 rounded-xl border border-indigo-100">
                <strong>Teacher's Tip:</strong> ${stage.explanation}
                ${state.showChinese ? `<br/><span class="text-slate-600">${stage.zhNote}</span>` : ''}
              </div>
            </div>
          </div>

          <!-- Student Homework Writing Pad -->
          <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="text-lg font-extrabold text-slate-900">
                  Your Homework Writing Pad (試寫你的文章)
                </h3>
                <p class="text-xs text-slate-500">
                  Target: ~400–450 words total (~100 words per body paragraph). Your draft is saved automatically while you switch tabs!
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <span id="draft-word-count" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-800 text-xs font-bold border border-slate-200">
                  0 words
                </span>
                <button
                  onclick="handleClearDraft()"
                  class="px-3 py-1.5 rounded-xl border text-xs font-bold transition ${
                    state.confirmClearDraft
                      ? 'bg-rose-600 text-white border-rose-600'
                      : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                  }"
                >
                  ${state.confirmClearDraft ? 'Confirm Clear?' : 'Clear'}
                </button>
                <button
                  onclick="copyEssayToClipboard()"
                  class="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 transition"
                >
                  Copy Draft
                </button>
              </div>
            </div>

            <!-- Quick Sentence Starter Chips -->
            <div class="flex flex-wrap gap-1.5">
              <button onclick="insertStarter('First and foremost, taking a part-time job allows senior secondary students to ')" class="px-2.5 py-1.5 rounded-lg bg-sky-50 text-sky-800 border border-sky-200 text-xs font-semibold hover:bg-sky-100">+ Pro 1 Topic</button>
              <button onclick="insertStarter('Compared with peers who rely completely on their families, working students ')" class="px-2.5 py-1.5 rounded-lg bg-teal-50 text-teal-800 border border-teal-200 text-xs font-semibold hover:bg-teal-100">+ Compared with...</button>
              <button onclick="insertStarter('Unlike the school classroom, where teachers guide students step by step, a workplace requires ')" class="px-2.5 py-1.5 rounded-lg bg-teal-50 text-teal-800 border border-teal-200 text-xs font-semibold hover:bg-teal-100">+ Unlike...</button>
              <button onclick="insertStarter('Spending long hours on a job leads to poor time management, which eventually causes ')" class="px-2.5 py-1.5 rounded-lg bg-indigo-50 text-indigo-800 border border-indigo-200 text-xs font-semibold hover:bg-indigo-100">+ Leads to... which causes</button>
              <button onclick="insertStarter('For example, a Form 5 student working at a ')" class="px-2.5 py-1.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 text-xs font-semibold hover:bg-amber-100">+ For example...</button>
              <button onclick="insertStarter('Nevertheless, focusing solely on these benefits would be unfair; there is another side to the coin.\n\n')" class="px-2.5 py-1.5 rounded-lg bg-purple-50 text-purple-800 border border-purple-200 text-xs font-semibold hover:bg-purple-100">+ Transition</button>
            </div>

            <textarea
              id="homework-textarea"
              oninput="updateWordCount(true)"
              rows="11"
              placeholder="Write your article for the school newsletter here...&#10;&#10;Title: Pros and cons of senior secondary students taking part-time jobs&#10;&#10;Paragraph 1 (Introduction): Nowadays, it is common for senior secondary students in Hong Kong to take up part-time jobs..."
              class="w-full p-4 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm sm:text-base leading-relaxed text-slate-800"
            >${escapeHtml(state.draftText)}</textarea>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function setBeforeAfterStage(stageNum) {
      state.beforeAfterStage = stageNum;
      if (stageNum === 3) {
        awardStar('before_after_full', 3);
      }
      renderCurrentStep();
    }

    function insertStarter(phrase) {
      const ta = document.getElementById('homework-textarea');
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const current = ta.value;
      ta.value = current.substring(0, start) + phrase + current.substring(end);
      ta.focus();
      ta.selectionStart = ta.selectionEnd = start + phrase.length;
      updateWordCount(true);
    }

    function updateWordCount(shouldReward = true) {
      const ta = document.getElementById('homework-textarea');
      const badge = document.getElementById('draft-word-count');
      if (!ta || !badge) return;
      state.draftText = ta.value;
      if (state.confirmClearDraft && ta.value.trim()) {
        state.confirmClearDraft = false;
      }
      const words = ta.value.trim().split(/\s+/).filter(Boolean);
      badge.textContent = `${words.length} words`;
      if (words.length >= 380) {
        badge.className =
          'px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-bold border border-emerald-300';
        if (shouldReward) {
          awardStar('draft_target_reached', 4);
        }
      } else {
        badge.className =
          'px-3 py-1.5 rounded-xl bg-slate-100 text-slate-800 text-xs font-bold border border-slate-200';
      }
    }

    function handleClearDraft() {
      if (!state.draftText.trim()) {
        showToast('Your writing pad is already empty!', 'warning');
        return;
      }
      if (!state.confirmClearDraft) {
        state.confirmClearDraft = true;
        renderCurrentStep();
        return;
      }
      state.draftText = '';
      state.confirmClearDraft = false;
      renderCurrentStep();
      showToast('Writing pad cleared.', 'info');
    }

    function copyEssayToClipboard() {
      const ta = document.getElementById('homework-textarea');
      if (!ta || !ta.value.trim()) {
        showToast('Write a few sentences first before copying!', 'warning');
        return;
      }
      try {
        ta.select();
        document.execCommand('copy');
        if (window.getSelection) {
          window.getSelection().removeAllRanges();
        }
        showToast('Draft copied to clipboard! Ready to paste into Google Docs / Word.', 'success');
      } catch (err) {
        showToast('Please select your text manually and press Ctrl+C / Cmd+C to copy.', 'warning');
      }
    }

    // Boot application on window load
    window.onload = initApp;
  </script>
</body>
</html>
